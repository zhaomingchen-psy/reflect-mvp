<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFLECT · MVP</title>
<style>
  :root{--ink:#1a1a1a;--sub:#6b6b6b;--line:#e5e2dc;--bg:#faf9f7;--card:#ffffff;
        --hit:#2e7d32;--hitbg:#eaf4ea;--partial:#b26a00;--partialbg:#fdf3e3;--miss:#b3372e;--missbg:#fbecea;
        --accent:#3d5a80;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Songti SC","Noto Serif CJK SC",serif;background:var(--bg);color:var(--ink);line-height:1.75}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:16px}
  .tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);
       border-radius:99px;padding:1px 10px;margin-bottom:10px}
  .bg{color:var(--sub);font-size:13px;margin-bottom:10px}
  .ctx{color:var(--sub);font-size:14px;white-space:pre-line;border-left:3px solid var(--line);
       padding-left:12px;margin-bottom:14px}
  .utt{font-size:16px;background:var(--bg);border-radius:8px;padding:14px 16px}
  label{font-size:13px;color:var(--sub);display:block;margin:16px 0 6px}
  textarea{width:100%;min-height:90px;font:inherit;font-size:15px;padding:12px;border:1px solid var(--line);
           border-radius:8px;resize:vertical;background:#fff}
  textarea:focus{outline:none;border-color:var(--accent)}
  select{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);
         border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;appearance:none;
         background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
         background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
         background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:focus{outline:none;border-color:var(--accent)}
  select:invalid{color:var(--sub)}
  optgroup{font-size:12px;color:var(--sub)}
  .casebox{background:var(--bg);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:14px;
           color:var(--ink);line-height:1.7;display:none}
  .casebox.on{display:block}
  .casebox .cat{color:var(--accent);font-weight:700;margin-right:8px}
  .rate{display:flex;align-items:center;gap:12px;margin-top:8px}
  .rate input{flex:1}
  .rate span{font-variant-numeric:tabular-nums;width:2em;text-align:center}
  button{font:inherit;font-size:15px;padding:9px 22px;border-radius:8px;border:1px solid var(--accent);
         background:var(--accent);color:#fff;cursor:pointer;margin-top:14px}
  button.ghost{background:#fff;color:var(--accent)}
  button:disabled{opacity:.5;cursor:wait}
  .fb{border-radius:10px;padding:18px 20px;margin-top:16px;border:1px solid var(--line)}
  .fb.hit{background:var(--hitbg)}  .fb.partial{background:var(--partialbg)}  .fb.miss{background:var(--missbg)}
  .verdict{font-weight:700;font-size:15px;margin-bottom:8px}
  .hit .verdict{color:var(--hit)} .partial .verdict{color:var(--partial)} .miss .verdict{color:var(--miss)}
  .fb dl{font-size:14px}
  .fb dt{color:var(--sub);font-size:12px;margin-top:8px}
  .fb dd{margin:1px 0 0}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  .dots{display:flex;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dot.cur{background:var(--accent)} .dot.done{background:var(--hit)}
  .home>button{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);
               border:1px solid var(--line);padding:16px 18px;margin-top:10px}
  .home>button:hover{border-color:var(--accent)}
  .home b{color:var(--accent)}
  .spin{color:var(--sub);font-size:14px;margin-top:14px;display:none}
  .err{color:var(--miss);font-size:14px;margin-top:10px}
  .chat{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:420px;overflow-y:auto;padding-right:4px}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:15px;line-height:1.7}
  .msg.client{background:var(--bg);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.typing{color:var(--sub);font-style:italic;background:none;border:none}
  .convbar{display:flex;gap:10px;align-items:flex-end}
  .convbar textarea{flex:1;min-height:56px}
  .moment{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
  .moment .reveal{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .moment.open .reveal{display:block}
  .selfjudge{display:flex;gap:8px;margin-top:10px}
  .selfjudge button{font-size:13px;padding:5px 14px;border-radius:99px}
  .sumbox{background:var(--bg);border-radius:10px;padding:14px 18px;margin-top:14px;font-size:14px}
  .sumbox dt{color:var(--sub);font-size:12px;margin-top:8px}
  .polish{border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px;background:#f6f8fb}
  .polish .pr{color:var(--sub);font-size:12px;margin-top:6px}
  .polish button{font-size:13px;padding:5px 14px;margin-top:8px;margin-right:8px}
  /* ---- 练习页双栏 ---- */
  .wrap.wide{max-width:1180px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
  .side{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 40px);overflow-y:auto}
  .side .card{padding:14px 16px;margin-bottom:0}
  .side h4{font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700}
  .side .b{font-size:13px;line-height:1.65}
  .side ul{margin:4px 0 0 18px;font-size:13px}
  .side li{margin-top:3px}
  .side details{font-size:13px;margin-top:8px}
  .side details summary{cursor:pointer;color:var(--accent);font-size:12px}
  .sdemo{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px;line-height:1.6}
  .sdemo .who{color:var(--sub)}
  .crit{font-size:13px;margin-top:6px}
  .crit li{margin-top:5px;list-style:none}
  .crit .ck{font-weight:700;margin-right:5px}
  .crit .yes{color:var(--hit)} .crit .no{color:var(--miss)} .crit .na{color:var(--sub)}
  .crit .note{color:var(--sub);font-size:12px;display:block;margin-left:18px}
  .hist{border-left:3px solid var(--line);padding-left:10px;margin-top:10px;font-size:13px}
  .hist .r{color:var(--sub);font-size:12px;margin-bottom:3px}
  .badge{font-size:11px;padding:1px 7px;border-radius:99px}
  .badge.hit{background:var(--hitbg);color:var(--hit)}
  .badge.partial{background:var(--partialbg);color:var(--partial)}
  .badge.miss{background:var(--missbg);color:var(--miss)}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .meta span{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--sub)}
  /* ---- 三阶段循环 v1 ---- */
  .stages{display:flex;gap:6px;margin-bottom:14px;font-size:12px}
  .stages span{flex:1;text-align:center;padding:5px 0;border-radius:99px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
  .stages span.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .stages span.done{color:var(--accent);border-color:var(--accent)}
  .pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .pick button{margin-top:0;font-size:13px;padding:6px 14px;border-radius:99px;background:#fff;color:var(--accent)}
  .pick button.sel{background:var(--accent);color:#fff}
  .pick button:disabled{opacity:1;cursor:default}
  .calline{font-size:14px;padding:8px 12px;border-radius:8px;margin-bottom:10px;background:#fff;border:1px solid var(--line)}
  .calline .ok{color:var(--hit);font-weight:700} .calline .off{color:var(--partial);font-weight:700}
  .flawed{border-left:3px solid var(--miss);background:var(--missbg);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:10px;font-size:15px}
  .pairopt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);
           padding:10px 14px;margin-top:8px;font-size:15px;line-height:1.6}
  .pairopt:hover{border-color:var(--accent)}
  .pairopt:disabled{opacity:1;cursor:default}
  .pairopt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .pairopt.good{border-color:var(--hit);background:var(--hitbg)} .pairopt.bad{border-color:var(--miss);background:var(--missbg)}
  .pairopt b{color:var(--accent);margin-right:6px}
  .notecard{border:1px solid var(--accent);border-radius:10px;padding:14px 18px;margin:8px 0 14px}
  .notecard h4{font-size:14px;color:var(--accent);margin:12px 0 6px}
  .notecard h4:first-child{margin-top:0}
  .lbar{display:grid;grid-template-columns:64px 1fr 28px;align-items:center;gap:8px;font-size:13px;margin-top:5px}
  .lbar .track{height:10px;border-radius:5px;background:var(--bg)}
  .lbar .fill{height:10px;border-radius:5px;background:var(--line)}
  .lbar.target .fill{background:var(--accent)}
  .lbar.target span:first-child{color:var(--accent);font-weight:700}
  .jrow{font-size:13px;margin-top:4px}
  @media (max-width:900px){.cols{grid-template-columns:1fr}.side{position:static;max-height:none}}
</style>
</head>

 content:{name:'Content Reflection',
   criteria:['Restate in your own words what the client said out loud — do not parrot it back verbatim','End on a statement, not a question','Include no advice, evaluation or new information'],
   def:'Restate accurately, in your own words, what the client actually said — hand the facts back so they can confirm you heard. It is the floor every other listening skill stands on: clients only keep going once they know they were heard.',
   why:'The novice impulse is to respond fast — advise, ask, diagnose. Content reflection asks you to do none of that and simply catch what was said. It looks trivial and it decides whether the client keeps talking.',
   how:['Take the core facts and say them in your own words rather than replaying the sentence;','If they said several things, try to carry the main ones so they hear themselves whole;','End on a statement, not a question mark — a reflection says "I heard that", not "did I get it right?".'],
   pitfalls:['Sliding into advice ("You could try...") — they have not been heard yet, so no solution will land;','Parroting — repeating the exact words sounds mechanical; restatement needs your own words;','Rushing to ask ("And then?" "Why?") — reflect first, everything else after.'],
   demos:[
     {c:"I worked three extra shifts this week, then it's homework with my kid at night, and now my mother is in hospital. I feel like I've been cut into pieces.",
      r:"Three things pulling at once — the extra shifts, your kid's homework, your mother in hospital. You're being dragged in every direction.",tag:'good',note:'All three are caught, in the counsellor\'s own words ("dragged in every direction" answers "cut into pieces"), with no question and no fix.'},
     {c:"I worked three extra shifts this week, then it's homework with my kid at night, and now my mother is in hospital. I feel like I've been cut into pieces.",
      r:"Have you thought about hiring some help? Or asking your manager for fewer shifts?",tag:'bad',badtype:'Common departure · advice',note:'The plan may even be sound, but right now she needs to be heard. Once advice arrives, the rest of what she was going to say goes back down.'}]},
 feeling:{name:'Reflection of Feeling',
   criteria:['Name one specific emotion belonging to the client','Deliver it as a statement — you may leave room, but do not let it rise into a question','Include no reassurance, advice, or explaining a third party'],
   def:"Name the client's emotion accurately in one sentence — the one they said and the one hiding in what they said — so the feeling is caught rather than left hanging.",
   why:'People visibly exhale the moment a feeling is named precisely. Told vaguely that they are "upset", or hurried past with "don\'t worry about it", they put the feeling away. Reflection of feeling trains the accuracy of the naming.',
   how:['Find the specific word: wronged, humiliated, suspended, hollow — the more specific the more it lands; "bad" and "uncomfortable" are too wide;','Tie the emotion to its situation ("Being told that in front of the whole group, you were humiliated") so it has somewhere to sit;','Match the intensity: if they are "a bit let down" do not say "devastated"; if they are devastated do not say "a bit down".'],
   pitfalls:['Reassurance ("Don\'t take it to heart", "It\'ll get better") — this tells them the feeling need not exist;','Explaining a third party ("Your supervisor probably meant well") — the topic jumps instantly from their feeling to someone else\'s motives;','A word too wide ("You\'re pretty uncomfortable") — it fits anything, so it names nothing.'],
   demos:[
     {c:"My roommates use my stuff and never mention it. I brought it up once and they told me I was being petty.",
      r:"You raise it and get called petty for it — that lands as unfair, like caring about it at all became your fault.",tag:'good',note:'"Unfair" is accurate, and the shape of the unfairness is named too: her reasonable objection got turned into the offence.'},
     {c:"My roommates use my stuff and never mention it. I brought it up once and they told me I was being petty.",
      r:"That's pretty normal between roommates, honestly. Don't let it get to you — I'm sure they don't mean anything by it.",tag:'bad',badtype:'Common departure · reassurance + explaining away',note:'Two departures stacked: the feeling is talked out of existence and the roommates are acquitted. She will not raise it again — with anyone.'}]},
 meaning:{name:'Reflection of Meaning',
   criteria:['Reach for the meaning, need or stake the client has not said outright','Offer it tentatively ("it sounds like", "it seems")','Pass no judgment, apply no labels, offer no interpretation'],
   def:'Reflect the meaning and the need behind the emotion — what they care about, what this event means to them — reaching what is unsaid but already present in their words.',
   why:'This is the deepest of the three. Done well, clients feel a jolt of being understood and often fall silent for a second before saying "...yes. Exactly." Overdone, it becomes an imposed interpretation. The line is this: say only what is already in their words, never what you deduced.',
   how:['Listen for the stake behind the event: what they return to, where the voice shifts, where they trail off — the meaning is usually buried there;','Offer it tentatively — "it sounds like...", "it seems like..." — the opening lets them correct you;','Connect the emotion to the need ("It hurts because what you actually wanted was...") rather than stopping at the name of the feeling.'],
   pitfalls:['Over-interpreting — narrating depths that are simply not in their words is speculation, not reflection;','Passing judgment ("You just haven\'t let it go") — judgment closes the conversation, tentativeness opens it;','Skipping the first two layers — going for meaning before content and feeling are caught leaves them feeling dissected rather than understood.'],
   demos:[
     {c:"Since my dad got sick I go back every weekend. But I sit there with nothing to say and end up on my phone.",

     {c:"Since my dad got sick I go back every weekend. But I sit there with nothing to say and end up on my phone.",
      r:"That's classic avoidant attachment — your early relationship with your father set the pattern you're both stuck in now.",tag:'bad',badtype:'Common departure · over-interpretation / labelling',note:'A living person has been filed into a term. Even if the analysis were right, at this moment it only produces defence — reflection means seeing it alongside them, not diagnosing on their behalf.'}]}};

/* ---- 进度与历史：浏览器本地保存，并与服务器日志合并 ---- */
let PROG={hist:{},fix:{},convs:[]};
function progKey(){return 'reflect_prog::'+USER+'::'+LANG;}
function saveProg(){try{localStorage.setItem(progKey(),JSON.stringify(PROG));}catch(e){}}
async function loadProg(){
  PROG={hist:{},fix:{},convs:[]};
  try{const raw=localStorage.getItem(progKey());if(raw)PROG=Object.assign(PROG,JSON.parse(raw));}catch(e){}
  try{
    const r=await api('/api/history?user='+encodeURIComponent(USER)+'&lang='+LANG);
    if(r.ok){
      const d=await r.json();
      (d.items||[]).forEach(x=>{
        const a=(PROG.hist[x.item]=PROG.hist[x.item]||[]);
        if(!a.some(y=>y.ts===x.ts&&y.attempt===x.attempt))a.push({attempt:x.attempt,resp:x.response,f:x.f,ts:x.ts,my:x.self_layer,real:x.layer});
      });
      Object.entries(d.fix||{}).forEach(([k,v])=>{if(!PROG.fix[k])PROG.fix[k]=v;});
      (d.convs||[]).forEach(c=>{if(!PROG.convs.some(y=>y.session===c.session))PROG.convs.push(c);});
    }
  }catch(e){}
  Object.values(PROG.hist).forEach(a=>a.sort((p,q)=>(p.ts||'').localeCompare(q.ts||'')));
  PROG.convs.sort((p,q)=>(p.ts||'').localeCompare(q.ts||''));
  syncProg();saveProg();
}
function syncProg(){
  HIST=PROG.hist;FIXDONE=PROG.fix;
  results={};CAL={};
  const all=[];
  Object.entries(HIST).forEach(([id,a])=>{if(a.length)results[id]=a[a.length-1].f.verdict;a.forEach(x=>all.push([id,x]));});
  all.sort((p,q)=>(p[1].ts||'').localeCompare(q[1].ts||'')).forEach(([id,x])=>{
    const it=ITEM_BY_ID[id];if(it&&x.my&&x.real)(CAL[it.skill]=CAL[it.skill]||[]).push(x.my===x.real);});
}
function nowTs(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;}
function itemSort(a,b){return ((a.level||2)-(b.level||2))||((a.type==='fix')-(b.type==='fix'))||a.id.localeCompare(b.id);}
function modItems(sk,mode){return ITEMS.filter(i=>i.skill===sk&&(mode==='opt'?!!i.optional:!i.optional)).sort(itemSort);}
function isDone(it){return (HIST[it.id]||[]).length>0;}
function firstUndone(list){const i=list.findIndex(x=>!isDone(x));return i<0?list.length:i;}
function startQueue(sk,mode,fromStart){
  QMODE=mode;queue=modItems(sk,mode);
  qi=fromStart?0:firstUndone(queue);
  if(qi>=queue.length){return moduleSummary(sk);}
  showItem();
}

async function goalSet(action){
  const sk=window.__goalSkill;
  let goal='';
  if(action==='keep')goal=GOAL;
  if(action==='new'){
    goal=($('#goaltxt').value||'').trim();
    if(!goal){$('#goalerr').innerHTML=`<div class="err">${t.goalEmpty}</div>`;return;}
  }
  api('/api/goal',{method:'POST',body:JSON.stringify({user:USER,skill:sk,action,goal})}).catch(()=>{});
  if(action!=='skip'){GOAL=goal;GOAL_SRC='prospective';}
  const fn=GOAL_NEXT;GOAL_NEXT=null;if(fn)fn();
}

function langBar(){
  return `<div style="text-align:right;font-size:12px;margin-bottom:8px">
    <a href="#" style="color:${LANG==='zh'?'var(--accent)':'var(--sub)'};font-weight:${LANG==='zh'?'700':'400'}" onclick="switchLang('zh');return false">中文</a>
    <span style="color:var(--line)"> | </span>
    <a href="#" style="color:${LANG==='en'?'var(--accent)':'var(--sub)'};font-weight:${LANG==='en'?'700':'400'}" onclick="switchLang('en');return false">English</a></div>`;
}
async function boot(){
  SKILL_INTRO=SKILL_INTRO_ALL[LANG];
  ACCESS=ACCESS||localStorage.getItem('psyclient_code')||'';
  let r=await api('/api/items?lang='+LANG);
  if(r.status===401){return askCode();}
  const d=await r.json();
  ITEMS=d.items;SKILLS=d.skills;CRITERIA=d.criteria||{};
  ITEM_BY_ID={};ITEMS.forEach(i=>ITEM_BY_ID[i.id]=i);
  if(!USER){askUser();}else{await loadGoal();await loadProg();home();}
}
function askCode(bad){
  $('#app').innerHTML=`${langBar()}<div class="card"><b>${t.codeAsk}</b>
    <p class="sub" style="margin-top:6px">${t.codeHint}</p>
    <input id="ucode" type="password" style="width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px" placeholder="${t.codeAsk}">
    ${bad?`<div class="err">${t.codeBad}</div>`:''}
    <button onclick="setCode()">${t.start}</button></div>`;
  const i=$('#ucode');i.focus();
  i.addEventListener('keydown',e=>{if(e.key==='Enter')setCode();});
}
async function setCode(){
  const v=$('#ucode').value.trim();
  if(!v)return;
  ACCESS=v;
  const r=await api('/api/items?lang='+LANG);
  if(r.status===401){ACCESS='';return askCode(true);}
  localStorage.setItem('psyclient_code',v);
  boot();
}
function askUser(){
  $('#app').innerHTML=`${langBar()}<div class="card"><b>${t.who}</b>
    <p class="sub" style="margin-top:6px">${t.whoHint}</p>
    <input id="uname" style="width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px" placeholder="${t.namePh}" value="${USER}">
    <button onclick="setUser()">${t.start}</button></div>`;
  const i=$('#uname');i.focus();
  i.addEventListener('keydown',e=>{if(e.key==='Enter')setUser();});
}
async function setUser(){
  const v=$('#uname').value.trim();
  if(!v)return;
  USER=v;localStorage.setItem('psyclient_user',v);await loadGoal();await loadProg();home();
}
function home(){
  narrow();
  const bySkill={};ITEMS.forEach(it=>{(bySkill[it.skill]=bySkill[it.skill]||[]).push(it)});
  let h=`${langBar()}<div class="home">${goalLine()}<div class="sub">${t.cur}<b>${USER}</b> <a href="#" style="color:var(--accent)" onclick="askUser();return false">${t.switch}</a> · ${t.pick}
    · <a href="#" style="color:var(--accent)" onclick="historyPage();return false">${t.histBtn}</a></div>`;
  for(const [sk,items] of Object.entries(bySkill)){
    const core=modItems(sk,'core'),opt=modItems(sk,'opt');
    const cd=core.filter(isDone).length,od=opt.filter(isDone).length;
    h+=`<div style="border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px;background:#fff">
      <div style="cursor:pointer" onclick="startSkill('${sk}')">
        <b style="color:var(--accent)">${SKILLS[sk]}</b>
        <span class="sub" style="font-size:12px;margin-left:6px">${t.progCore(cd,core.length)}${opt.length?' · '+t.progOpt(od,opt.length):''}${t.plusConv}</span>
        <div style="font-size:13px;color:var(--sub);margin-top:4px">${SKILL_INTRO[sk].def}</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button style="margin-top:0;font-size:13px;padding:6px 14px" onclick="startSkill('${sk}')">${cd&&cd<core.length?t.contCore(cd+1):t.startPractice}</button>
        <button class="ghost" style="margin-top:0;font-size:13px;padding:6px 14px" onclick="convPicker('${sk}')">${t.convNow}</button>
        ${cd+od?`<button class="ghost" style="margin-top:0;font-size:13px;padding:6px 14px" onclick="moduleSummary('${sk}')">${t.sumBtn}</button>`:''}
      </div></div>`;
  }
  h+=`<div style="margin-top:20px;border-top:1px dashed var(--line);padding-top:12px">
    <span class="sub" style="font-size:12px">${t.scaLine}
    <a href="#" style="color:var(--accent)" onclick="startSCA('A');return false">${t.formA}</a> ·
    <a href="#" style="color:var(--accent)" onclick="startSCA('B');return false">${t.formB}</a></span></div>`;
  h+='</div>';$('#app').innerHTML=h;
}
let queue=[],qi=0;
const LV=n=>t.lv[n]||'';
function startSkill(sk){goalGate(sk,()=>teachPage(sk));}
function teachPage(sk){
  narrow();
  const core=modItems(sk,'core'),opt=modItems(sk,'opt');
  const cd=core.filter(isDone).length,od=opt.filter(isDone).length,nx=firstUndone(core);
  queue=core;qi=0;QMODE='core';
  const progBox=(cd+od)?`<div class="sumbox" style="margin:0 0 14px">
      <b>${t.lastTime}</b>${t.progCore(cd,core.length)}${opt.length?' · '+t.progOpt(od,opt.length):''}
      ${cd>=core.length?`<div class="sub" style="font-size:13px;margin:4px 0 0">${t.allCoreDone}</div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${cd<core.length?`<button style="font-size:13px;padding:6px 14px" onclick="startQueue('${sk}','core')">${t.contCore(nx+1)}</button>`:''}
        <button class="ghost" style="font-size:13px;padding:6px 14px" onclick="moduleSummary('${sk}')">${t.sumBtn}</button>
      </div></div>`:'';
  const s=SKILL_INTRO[sk];

  const demoHtml=`<div style="font-size:14px;margin-top:6px"><b>${t.pairsTitle}</b>
      <span class="sub" style="font-size:12px">${t.pairIntro}</span></div>
    <div id="pairbox"></div>`;
  $('#app').innerHTML=`<div class="card">${stageBar(1)}${goalLine()}${progBox}<span class="tag">${s.name} · ${t.demoTitle}</span>
    <p style="margin-bottom:8px"><b>${s.def}</b></p>
    <p class="sub" style="font-size:14px;margin-bottom:14px">${s.why}</p>
    <div style="font-size:14px"><b>${t.criteria}</b><span class="sub" style="font-size:12px">${t.criteriaNote}</span></div>
    <ul style="font-size:14px;margin:4px 0 12px 20px">${critList.map(x=>`<li style="margin-top:4px">${x}</li>`).join('')}</ul>
    <div style="font-size:14px"><b>${t.howto}</b></div>
    <ul style="font-size:14px;margin:4px 0 12px 20px">${s.how.map(x=>`<li style="margin-top:4px">${x}</li>`).join('')}</ul>
    <div style="font-size:14px"><b>${t.pitfalls}</b></div>
    <ul style="font-size:14px;margin:4px 0 14px 20px">${s.pitfalls.map(x=>`<li style="margin-top:4px">${x}</li>`).join('')}</ul>
    ${demoHtml}
    <p class="sub" style="font-size:12px;margin-top:12px">${t.placeholderNote}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="startQueue('${sk}','core',${cd>=core.length})">${cd?(cd<core.length?t.contCore(nx+1):t.redoCore):t.startCore}（${core.length}${t.items}）</button>
    ${opt.length?`<button class="ghost" onclick="startQueue('${sk}','opt')">${t.optBtn(od,opt.length)}</button>`:''}
    ${cd+od?`<button class="ghost" onclick="moduleSummary('${sk}')">${t.sumBtn}</button>`:''}
    <button class="ghost" onclick="convPicker('${sk}')">${t.jumpConv}</button>
    <button class="ghost" onclick="home()">${t.back}</button></div>
    ${opt.length?`<div class="sub" style="font-size:12px;margin:8px 0 0">${t.optNote}</div>`:''}</div>`;
  drawPair();
}
/* 对比例子：先选哪句更深 → 再选差在哪条标准 → 揭示解释。选择落日志，可看练习前的辨别力。 */
function drawPair(){
  const box=$('#pairbox');if(!box||!CP)return;
  const ps=(PAIRS_ALL[LANG]||{})[CP.sk]||[];
  if(CP.i>=ps.length){box.innerHTML=`<div class="sub" style="font-size:13px;margin-top:8px">${t.pairAllDone}</div>`;return;}
  const p=ps[CP.i];
  const crit=(CRITERIA[CP.sk]||SKILL_INTRO[CP.sk].criteria||[]);
  const done=CP.crit!==null;
  const cls=k=>!done?(CP.pick===k?'sel':''):(p.better===k?'good':'bad');
  const tagOf=k=>done?`<span class="badge ${p.better===k?'hit':'miss'}" style="margin-left:6px">${p.better===k?t.pairBetter:t.pairWorse}</span>`:'';
  box.innerHTML=`<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px">
    <div class="sub" style="font-size:12px;margin-bottom:6px">${t.pairN(CP.i+1,ps.length)}</div>
    <div class="ctx" style="margin-bottom:4px">${t.clientSaid}${esc2(p.c)}</div>
    <div style="font-size:14px;margin-top:6px"><b>${t.pairAsk}</b></div>
    ${['a','b'].map(k=>`<button class="pairopt ${cls(k)}" ${CP.pick?'disabled':''} onclick="pairPick('${k}')"><b>${k.toUpperCase()}</b>${esc2(p[k])}${tagOf(k)}</button>`).join('')}
    ${CP.pick?`<div style="font-size:13px;margin-top:8px;color:${CP.pick===p.better?'var(--hit)':'var(--partial)'}">${CP.pick===p.better?t.pairRight:t.pairWrong}</div>
      <div style="font-size:14px;margin-top:8px"><b>${t.pairWhy}</b></div>
      <div class="pick">${crit.map((c,i)=>`<button class="${done&&i===p.crit?'sel':''}" ${done?'disabled':''} onclick="pairCrit(${i})" style="text-align:left">${i+1}. ${esc2(c)}</button>`).join('')}</div>`:''}
    ${done?`<div style="font-size:13px;margin-top:8px;color:${CP.crit===p.crit?'var(--hit)':'var(--partial)'}">${CP.crit===p.crit?t.critRight:t.critWrong(p.crit+1)}</div>
      <div class="sub" style="font-size:13px;margin:6px 0 0">${esc2(p.note)}</div>
      <button class="ghost" style="font-size:13px;padding:6px 14px" onclick="pairNext()">${t.pairNext}</button>`:''}
  </div>`;
}
function pairPick(k){if(CP.pick)return;CP.pick=k;drawPair();}
function pairCrit(i){
  if(CP.crit!==null)return;CP.crit=i;
  const p=((PAIRS_ALL[LANG]||{})[CP.sk]||[])[CP.i];
  api('/api/annotate',{method:'POST',body:JSON.stringify({key:'contrast:'+LANG+':'+CP.sk+':'+CP.i,agree:true,
    note:'pick:'+CP.pick+'|better:'+p.better+'|crit:'+i+'|answer:'+p.crit,user:USER})}).catch(()=>{});
  drawPair();
}
function pairNext(){CP.i++;CP.pick=null;CP.crit=null;drawPair();}
function showItem(){
  if(qi>=queue.length){return finish();}
  cur=queue[qi];
  attempt=(HIST[cur.id]||[]).length+1;ROUND_BASE=attempt-1;
  render();
}
function sideRef(){
  const s=SKILL_INTRO[cur.skill];
  const crit=(CRITERIA[cur.skill]||s.criteria||[]);
  const demos=((PAIRS_ALL[LANG]||{})[cur.skill]||[]).map(p=>{const w=p.better==='a'?'b':'a';return `<div class="sdemo">
      <div class="who">${t.clientSaid}${esc2(p.c)}</div>
      <div style="margin-top:4px"><span class="badge hit">${t.refGood}</span> ${esc2(p[p.better])}</div>
      <div style="margin-top:4px"><span class="badge miss">${t.refBad}</span> ${esc2(p[w])}</div>
    </div>`;}).join('');
  return `<div class="card" style="border-color:var(--accent)">
    <button onclick="convPicker('${cur.skill}')" style="width:100%;margin-top:0;font-size:14px;padding:8px 12px">${t.jumpConv}</button>
    <div class="sub" style="font-size:12px;margin-top:6px;text-align:center">${t.jumpConvNote}</div>
    <button class="ghost" onclick="moduleSummary('${cur.skill}')" style="width:100%;margin-top:8px;font-size:14px;padding:8px 12px">${t.sumBtn}</button>
  </div>
  <div class="card">
    <h4>${t.refTitle} · ${s.name}</h4>
    <div class="b">${s.def}</div>
    <details open><summary>${t.refCrit}</summary>
      <ul>${crit.map(x=>`<li>${x}</li>`).join('')}</ul></details>
    <details><summary>${t.refHow}</summary>
      <ul>${s.how.map(x=>`<li>${x}</li>`).join('')}</ul></details>
    <details><summary>${t.refPit}</summary>
      <ul>${s.pitfalls.map(x=>`<li>${x}</li>`).join('')}</ul></details>
    <details><summary>${t.refDemo}</summary>${demos}</details>
  </div>`;
}
function calCard(){
  const c=CAL[cur.skill]||[];
  if(!c.length)return '';
  const ok=c.filter(Boolean).length;
  return `<div class="card"><h4>${t.calTitle}</h4><div class="b"><b>${t.calTally(ok,c.length)}</b></div>
    <div style="display:flex;gap:4px;margin-top:6px">${c.map(x=>`<span class="badge ${x?'hit':'partial'}">${x?'✓':'✗'}</span>`).join('')}</div>
    <div class="sub" style="font-size:11px;margin:6px 0 0">${t.calTallyNote}</div></div>`;
}
function sideHist(){
  const h=HIST[cur.id]||[];
  if(!h.length)return `<div class="card"><h4>${t.histTitle}</h4>
    <div class="b" style="color:var(--sub)">${t.histNone}</div></div>`;
  return `<div class="card"><h4>${t.histTitle}</h4>
    ${h.map(x=>`<div class="hist">
      <div class="r">${t.histRound(x.attempt)} <span class="badge ${x.f.verdict}">${vLabel(x.f.verdict)}</span></div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:4px">${t.yourResp}${esc2(x.resp)}</div>
      ${x.f.comment?`<div style="font-size:12px">${esc2(x.f.comment)}</div>`:''}
      ${x.f.rewrite_hint?`<div style="font-size:12px;color:var(--accent);margin-top:3px">→ ${esc2(x.f.rewrite_hint)}</div>`:''}
    </div>`).join('')}</div>`;
}
function layerPick(){
  return `<label>${t.layerAsk}</label>
    <div class="pick" id="lpick">${['content','feeling','meaning','none'].map(k=>
      `<button class="${SELF_LAYER===k?'sel':''}" onclick="SELF_LAYER='${k}';document.querySelectorAll('#lpick button').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${t.layerNames[k]}</button>`).join('')}</div>`;
}
/* 找错改错题第一步：先找出原回应错在哪（答案在服务端核对），再进入改写 */
function fixBlock(){
  const fd=FIXDONE[cur.id];
  const keys=Object.keys(t.errNames);
  return `<div class="flawed"><span class="sub" style="font-size:12px">${t.fixFlawed}</span><br>${esc2(cur.flawed)}</div>
    <label>${t.fixAsk}</label>
    <div class="pick" id="fixpick">${keys.map(k=>`<button class="${fd&&(k===fd.answer)?'sel':''}" ${fd?'disabled':''}
      style="${fd&&k===fd.choice&&!fd.correct?'border-color:var(--miss);color:var(--miss)':''}" onclick="fixCheck('${k}')">${t.errNames[k]}</button>`).join('')}</div>
    <div id="fixres">${fd?`<div style="font-size:13px;margin-top:8px;color:${fd.correct?'var(--hit)':'var(--partial)'}">${fd.correct?t.fixRight:t.fixWrong(t.errNames[fd.answer]||fd.answer)}</div>
      <div class="sub" style="font-size:13px;margin:4px 0 0">${esc2(fd.note||'')}</div>`:''}</div>`;
}
async function fixCheck(k){
  if(FIXDONE[cur.id])return;
  document.querySelectorAll('#fixpick button').forEach(b=>b.disabled=true);
  try{
    const r=await api('/api/fix_check',{method:'POST',body:JSON.stringify({item_id:cur.id,choice:k,user:USER,lang:LANG})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'check failed');
    FIXDONE[cur.id]={choice:k,correct:d.correct,answer:d.answer,note:d.note};PROG.fix=FIXDONE;saveProg();
    render($('#resp')?$('#resp').value:'');
  }catch(e){
    $('#fixres').innerHTML=`<div class="err">${e.message}</div>`;
    document.querySelectorAll('#fixpick button').forEach(b=>b.disabled=false);
  }
}
function render(prevResp){
  RATE_TOUCHED=false;SELF_LAYER=null;
  const s=SKILL_INTRO[cur.skill];
  const isFix=cur.type==='fix', fixReady=!isFix||!!FIXDONE[cur.id];
  document.querySelector('.wrap').classList.add('wide');
  $('#app').innerHTML=`<div class="cols"><div>
  <div class="card">
    ${stageBar(2)}${goalLine()}
    <span class="tag">${s.name} · ${cur.optional?t.opt+' · ':''}${isFix?t.fixTag+' · ':''}${LV(cur.level)} · ${t.qOf(qi+1,queue.length)} · ${t.attempt(attempt)}</span>
    ${isFix?`<div class="sub" style="font-size:13px;margin:8px 0">${t.fixIntro}</div>`:''}
    <div class="bg">${cur.background}</div>
    <div class="ctx">${cur.context.replace(/\n/g,'<br>')}</div>
    <div class="utt">${cur.affect?`<span class="sub" style="font-size:12px">〔${t.affectPre}${cur.affect}〕</span><br>`:''}${cur.utterance}</div>
    ${isFix?fixBlock():''}
    <div id="answerzone" style="${fixReady?'':'display:none'}">
    <label>${isFix?t.fixNow:t.respLabel(s.name)}</label>
    <textarea id="resp">${prevResp||''}</textarea>
    ${layerPick()}
    <label>${t.selfRate}<span class="sub" style="font-size:12px"> ${t.selfRateNote}</span></label>
    <div class="rate"><span>0</span><input id="rate" type="range" min="0" max="10" value="5"
      oninput="RATE_TOUCHED=true;$('#rateV').textContent=this.value"><span>10</span><span id="rateV" style="color:var(--sub)">${t.unrated}</span></div>
    <button id="go" onclick="submit()">${t.submit}</button>
    <div class="spin" id="spin">${t.grading}</div>
    </div>
    <div id="fb"></div>
    <div class="nav"><div class="dots">${queue.map((q,i)=>`<div class="dot ${i<qi?'done':i===qi?'cur':''}"></div>`).join('')}</div>
    <div></div></div>
  </div></div>
  <div class="side" id="side">${sideRef()}${calCard()}${sideHist()}</div></div>`;
}
async function submit(){
  const resp=$('#resp').value.trim();
  if(!resp){$('#fb').innerHTML=`<div class="err">${t.needResp}</div>`;return;}
  if(!SELF_LAYER){$('#fb').innerHTML=`<div class="err">${t.needLayer}</div>`;return;}
  $('#go').disabled=true;$('#spin').style.display='block';$('#fb').innerHTML='';
  const myLayer=SELF_LAYER;
  try{
    const r=await api('/api/feedback',{method:'POST',
      body:JSON.stringify({item_id:cur.id,response:resp,attempt,self_rating:RATE_TOUCHED?+$('#rate').value:null,
                           self_layer:myLayer,user:USER,lang:LANG})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'请求失败');
    showFeedback(d.feedback,resp,myLayer,d.layer_canon,d.ts);
  }catch(e){
    $('#fb').innerHTML=`<div class="err">${e.message}（可重试）</div>`;
  }finally{$('#go').disabled=false;$('#spin').style.display='none';}
}
function showFeedback(f,resp,myLayer,realLayer,ts){
  const v=f.verdict;
  results[cur.id]=v;
  (HIST[cur.id]=HIST[cur.id]||[]).push({attempt,resp,f,ts:(ts||nowTs()),my:myLayer||null,real:realLayer||null});
  PROG.hist=HIST;saveProg();
  // 先判层对照：学员自判 vs 督导判定的落点
  let calHtml='';
  if(myLayer&&realLayer){
    const ok=myLayer===realLayer;
    (CAL[cur.skill]=CAL[cur.skill]||[]).push(ok);
    calHtml=`<div class="calline">${t.calYou}<b>${t.layerNames[myLayer]}</b>　｜　${t.calReal}<b>${t.layerNames[realLayer]}</b>
      <span class="${ok?'ok':'off'}">${ok?t.calOk:t.calOff}</span></div>`;
  }
  const crit=(CRITERIA[cur.skill]||SKILL_INTRO[cur.skill].criteria||[]);
  const cs=(f.criteria||[]).map((c,i)=>{
    const mark=c.ok===true?'<span class="ck yes">✓</span>':c.ok===false?'<span class="ck no">✗</span>':'<span class="ck na">–</span>';
    return `<li>${mark}${crit[i]||''}${c.note?`<span class="note">${esc2(c.note)}</span>`:''}</li>`;
  }).join('');
  const rows=[];
  if(f.captured)rows.push([t.captured,f.captured]);
  if(f.missed)rows.push([v==='hit'?t.noteIf:t.stillMiss,f.missed]);
  if(f.comment)rows.push([t.comment,f.comment]);
  if(f.why_it_matters)rows.push([t.whyMatters,f.why_it_matters]);
  if(f.rewrite_hint)rows.push([v==='hit'?t.hintMore:t.hintFix,f.rewrite_hint]);
  const canRetry=(attempt-ROUND_BASE)<3&&v!=='hit';
  $('#fb').innerHTML=`${calHtml}<div class="fb ${v}"><div class="verdict">${vLabel(v)}</div>
    <div class="meta">
      ${f.response_type?`<span>${t.respType}: ${esc2(f.response_type)}</span>`:''}
      ${f.layer?`<span>${t.landLayer}: ${esc2(f.layer)}</span>`:''}
    </div>
    <dl>${rows.map(([a,c])=>`<dt>${a}</dt><dd>${c}</dd>`).join('')}</dl>
    ${cs?`<dt style="color:var(--sub);font-size:12px;margin-top:10px">${t.critTitle}</dt>
      <ul class="crit">${cs}</ul>`:''}
    <div id="exbox">${EX_OK(cur.skill,v)
      ?`<button class="ghost" id="exbtn" onclick="getExample('${v}')" style="font-size:13px;padding:6px 14px">${t.exBtn}</button>`
      :`<div class="sub" style="font-size:12px;margin-top:10px">${t.exNone}</div>`}</div>
    ${canRetry?`<button onclick="retry('${encodeURIComponent(resp)}')">${t.retry(attempt+1)}</button>`:''}

const LAYER_ORDER={none:0,content:1,feeling:2,meaning:3};
function moduleSummary(sk,headline){
  narrow();
  const s=SKILL_INTRO[sk];
  const crit=(CRITERIA[sk]||s.criteria||[]);
  const its=ITEMS.filter(i=>i.skill===sk&&isDone(i));
  const atts=[];its.forEach(i=>(HIST[i.id]||[]).forEach(x=>atts.push(x)));
  const core=modItems(sk,'core'),opt=modItems(sk,'opt');
  const cd=core.filter(isDone).length,od=opt.filter(isDone).length;
  const btns=`<div style="display:flex;gap:8px;flex-wrap:wrap">
      ${cd<core.length?`<button onclick="startQueue('${sk}','core')">${t.contCore(firstUndone(core)+1)}</button>`:''}
      ${opt.length&&od<opt.length?`<button class="ghost" onclick="startQueue('${sk}','opt')">${t.optBtn(od,opt.length)}</button>`:''}
      <button class="ghost" onclick="convPicker('${sk}')">${t.convNow}</button>
      <button class="ghost" onclick="historyPage('${sk}')">${t.histBtn}</button>
      <button class="ghost" onclick="home()">${t.home}</button></div>`;
  if(!atts.length){
    $('#app').innerHTML=`<div class="card"><span class="tag">${t.sumTitle(s.name)}</span><p class="sub" style="margin:10px 0">${t.sumEmpty}</p>${btns}</div>`;return;
  }
  // 每题最近一次判定、首次命中、改写后命中
  const vc={hit:0,partial:0,miss:0};let first=0,improved=0;
  its.forEach(i=>{const a=HIST[i.id];const lv=a[a.length-1].f.verdict;if(vc[lv]!==undefined)vc[lv]++;
    if(a[0].f.verdict==='hit')first++;else if(a.some(x=>x.f.verdict==='hit'))improved++;});
  // 三条标准没做到的次数
  const cf=[0,0,0],cn=[0,0,0];
  atts.forEach(x=>(x.f.criteria||[]).forEach((c,k)=>{if(k<3&&c&&c.ok!==null&&c.ok!==undefined){cn[k]++;if(c.ok===false)cf[k]++;}}));
  // 没命中时的回应类型
  const tc={};atts.filter(x=>x.f.verdict!=='hit').forEach(x=>{const ty=(x.f.response_type||'').trim();
    if(ty&&!/^(反映|reflection)$/i.test(ty))tc[ty]=(tc[ty]||0)+1;});
  const types=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  // 落点层次
  const lc={content:0,feeling:0,meaning:0,none:0};atts.forEach(x=>{const l=x.real||null;if(l&&lc[l]!==undefined)lc[l]++;});
  const lt=Object.values(lc).reduce((a,b)=>a+b,0)||1;
  const shallow=atts.filter(x=>x.real&&x.real!=='none'&&LAYER_ORDER[x.real]<LAYER_ORDER[sk]).length;
  // 自判准确、找错识别
  const calA=atts.filter(x=>x.my&&x.real),calOk=calA.filter(x=>x.my===x.real).length;
  const fixIts=ITEMS.filter(i=>i.skill===sk&&i.type==='fix'&&FIXDONE[i.id]);
  const fixOk=fixIts.filter(i=>FIXDONE[i.id].correct).length;
  // 下一步：最多三条，按问题大小排
  const tips=[];
  const worst=cf.map((v,k)=>[k,v,cn[k]]).filter(x=>x[2]>=2&&x[1]/x[2]>=0.3).sort((a,b)=>b[1]/b[2]-a[1]/a[2])[0];
  if(worst)tips.push(t.sumCritTip(worst[0]+1,crit[worst[0]]||'',worst[1],worst[2]));
  if(types.length&&types[0][1]>=2){const ty=types[0][0];tips.push(t.sumTypeTip(ty,types[0][1])+((t.typeTip[ty]||t.typeTip[ty.toLowerCase()])||''));}
  if(sk!=='content'&&shallow>=2)tips.push(t.sumShallowTip(shallow,t.layerNames[sk]));
  if(calA.length>=3&&calOk/calA.length<0.6)tips.push(t.sumCalTip(calOk,calA.length));
  if(!tips.length)tips.push(atts.length<3?t.sumFew:(vc.hit/Math.max(its.length,1)>=0.6?t.sumOk:t.sumMixed));
  const bar=(label,n,tot,hl)=>`<div class="lbar ${hl?'target':''}"><span>${label}</span><div class="track"><div class="fill" style="width:${tot?Math.round(n/tot*100):0}%"></div></div><span>${n}</span></div>`;
  $('#app').innerHTML=`<div class="card">
    ${headline?`<div style="font-weight:700;margin-bottom:8px">${headline}</div>`:''}
    <span class="tag">${t.sumTitle(s.name)}</span>
    <div class="sub" style="margin:6px 0 10px">${t.sumBasis(its.length,atts.length)} · ${t.progCore(cd,core.length)}${opt.length?' · '+t.progOpt(od,opt.length):''}</div>
    <div class="notecard">
      <h4>${t.sumNext}</h4>
      <ul style="margin:0 0 0 18px;font-size:14px;line-height:1.8">${tips.map(x=>`<li>${esc2(x)}</li>`).join('')}</ul>
      <h4>${t.sumVerdicts}</h4>
      <div style="font-size:14px">${t.cHit} ${vc.hit} · ${t.cPartial} ${vc.partial} · ${t.cMiss} ${vc.miss}
        <span class="sub" style="font-size:12px;margin-left:8px">${t.sumFirstHit(first,its.length)} · ${t.sumImproved(improved)}</span></div>
      <h4>${t.sumCrit}</h4>
      ${crit.map((c,k)=>bar(`${k+1}`,cf[k],cn[k],worst&&worst[0]===k)+`<div class="sub" style="font-size:11px;margin:0 0 2px 72px">${esc2(c)}</div>`).join('')}
      ${types.length?`<h4>${t.sumTypes}</h4>${types.map(([ty,n])=>bar(esc2(ty),n,types.reduce((a,b)=>a+b[1],0),false)).join('')}`:''}
      <h4>${t.sumLayers}</h4>
      ${['content','feeling','meaning','none'].map(k=>bar(t.layerNames[k],lc[k],lt,k===sk)).join('')}
      <div style="font-size:13px;margin-top:10px">${calA.length?t.sumCal(calOk,calA.length):''}${fixIts.length?' · '+t.sumFix(fixOk,fixIts.length):''}</div>
    </div>
    ${btns}</div>`;
}

  if(!vals||vals.length<2)return '';
  const w=Math.min(320,vals.length*36),hh=44,pad=6;
  const xs=i=>pad+i*(w-2*pad)/(vals.length-1);
  const ys=v=>hh-pad-(v/10)*(hh-2*pad);
  const pts=vals.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const dots=vals.map((v,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3" fill="${v>=7?'var(--hit)':v<=3?'var(--miss)':'var(--accent)'}"><title>${v}</title></circle>`).join('');
  return `<svg width="${w}" height="${hh}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="var(--line)" stroke-width="2"/>${dots}</svg>`;
}
/* ③ 回看：练习笔记卡 —— 理解度曲线（悬停看台词）、三层落点、自判对照 */
function bigCurve(vals,lines){
  if(!vals||vals.length<2)return '';
  const W=560,H=160,pl=28,pr=12,pt=12,pb=26;
  const x=i=>pl+i*(W-pl-pr)/(vals.length-1), y=v=>pt+(10-(v==null?5:v))*(H-pt-pb)/10;
  let g='';
  [0,5,10].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${pl-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--sub)">${v}</text>`;});
  for(let i=1;i<vals.length;i++){
    const dv=(vals[i]??5)-(vals[i-1]??5);
    const col=dv>0?'var(--hit)':dv<0?'var(--miss)':'var(--sub)';
    g+=`<line x1="${x(i-1)}" y1="${y(vals[i-1])}" x2="${x(i)}" y2="${y(vals[i])}" stroke="${col}" stroke-width="2.5"/>`;
  }
  vals.forEach((v,i)=>{
    const tip=i===0?`${t.noteOpen}: ${v}`:`${i}. ${(lines[i-1]||'').replace(/"/g,'”')} → ${v}`;
    g+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#fff" stroke="var(--accent)" stroke-width="2"><title>${esc2(tip)}</title></circle>
      <text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--sub)">${i===0?t.noteOpen:i}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block">${g}</svg>`;
}
let DEBRIEF_JUDGE={};
function judgeHtml(){
  const ks=Object.keys(DEBRIEF_JUDGE);
  if(!ks.length)return `<div class="sub" style="font-size:13px;margin:0">${t.noteJudgeEmpty}</div>`;
  let agree=0;
  const rows=ks.sort((a,b)=>a-b).map(i=>{
    const {guess,v}=DEBRIEF_JUDGE[i];
    const ok=(v==='hit'&&guess==='hit')||(v==='miss'&&guess==='miss');
    if(ok)agree++;
    const mark=v==='partial'?'<span style="color:var(--partial)">◐</span>':ok?'<span style="color:var(--hit)">✓</span>':'<span style="color:var(--miss)">✗</span>';
    const vPlain={hit:t.cHit,partial:t.cPartial,miss:t.cMiss}[v]||v;
    return `<div class="jrow">${t.noteJudgeRow(+i+1,guess==='hit'?t.gotIt:t.missedIt,vPlain,mark)}</div>`;
  }).join('');
  return `<div style="font-size:13px;font-weight:700">${t.noteAgree(agree,ks.length)}</div>${rows}`;
}
function noteCard(d,noJudge){
  const L=d.layers||[];
  const cnt={content:0,feeling:0,meaning:0,none:0};
  L.forEach(k=>{if(cnt[k]!==undefined)cnt[k]++;});
  const tot=L.length||1;
  const target=CONV&&CONV.skill;
  const bars=['content','feeling','meaning','none'].map(k=>`<div class="lbar ${k===target?'target':''}">
      <span>${t.layerNames[k]}</span>
      <div class="track"><div class="fill" style="width:${Math.round(cnt[k]/tot*100)}%"></div></div>
      <span>${cnt[k]}</span></div>`).join('')+
    (target?`<div class="sub" style="font-size:11px;margin:4px 0 0 72px">${t.layerNames[target]} ${t.noteTarget}</div>`:'');
  const lines=(d.transcript||[]).map(x=>x.response);
  return `<div class="notecard">
    <h4>${t.noteTitle}</h4>
    <div class="sub" style="margin-bottom:6px">${t.cHit} ${(d.verdicts||[]).filter(v=>v==='hit').length} · ${t.cPartial} ${(d.verdicts||[]).filter(v=>v==='partial').length} · ${t.cMiss} ${(d.verdicts||[]).filter(v=>v==='miss').length}</div>
    ${d.understood_curve&&d.understood_curve.length>1?`<h4>${t.noteCurve}</h4>${bigCurve(d.understood_curve,lines)}
      <div class="sub" style="font-size:11px;margin:2px 0 0">${t.noteCurveTip}</div>`:''}
    ${L.length?`<h4>${t.noteLayers}</h4>${bars}`:''}
    ${noJudge?'':`<h4>${t.noteJudge}</h4><div id="judgebox">${judgeHtml()}</div>`}
  </div>`;
}
function drawDebrief(d){
  narrow();
  DEBRIEF=d;
  if(d.session&&!PROG.convs.some(c=>c.session===d.session)){
    PROG.convs.push({ts:d.ts||nowTs(),session:d.session,skill:d.skill||(CONV&&CONV.skill),case:d.case,category:d.category,
      verdicts:d.verdicts,layers:d.layers,understood_curve:d.understood_curve,summary:d.summary,transcript:d.transcript});
    saveProg();
  }
  loadGoal();  // 服务器已把本次改进方向存为新目标，刷新置顶横幅
  const vc={hit:0,partial:0,miss:0};d.verdicts.forEach(v=>{if(vc[v]!==undefined)vc[v]++;});
  const sm=d.summary||{};
  const VB=v=>`<span style="font-size:12px;padding:1px 8px;border-radius:99px;${v==='hit'?'background:var(--hitbg);color:var(--hit)':v==='partial'?'background:var(--partialbg);color:var(--partial)':'background:var(--missbg);color:var(--miss)'}">${{hit:t.cHit,partial:t.cPartial,miss:t.cMiss}[v]||v}</span>`;
  DEBRIEF_JUDGE={};
  $('#app').innerHTML=`<div class="card">${stageBar(3)}
    <span class="tag">${t.debriefTag(d.turns)}</span>
    ${noteCard(d)}
    ${d.prev_goal?`<div id="goalcheck" style="font-size:14px;background:#f6f8fb;border:1px dashed var(--accent);border-radius:8px;padding:12px 14px;margin:8px 0">
      <b>${t.goalLookBack}</b>${d.prev_goal_source==='prospective'?t.goalWasPros:t.goalWas}<i>${esc2(d.prev_goal)}</i><br>${t.goalAsk}
      <div style="display:flex;gap:8px;margin-top:8px">
        <button style="font-size:13px;padding:5px 14px;margin-top:0" onclick="goalProgress('${t.gYes}')">${t.gYes}</button>
        <button style="font-size:13px;padding:5px 14px;margin-top:0" onclick="goalProgress('${t.gNo}')">${t.gNo}</button>
        <button class="ghost" style="font-size:13px;padding:5px 14px;margin-top:0" onclick="goalProgress('${t.gMaybe}')">${t.gMaybe}</button>
      </div></div>`:''}
    <div class="sumbox"><dt>${t.smPattern}</dt><dd>${esc2(sm.pattern||'—')}</dd>
      <dt>${t.smDirection}</dt><dd>${esc2(sm.direction||'—')}</dd>
      ${sm.moment?`<dt>${t.smMoment}</dt><dd>${esc2(sm.moment)}</dd>`:''}</div>
    <div style="margin-top:16px"><b>${t.replayN(d.moments.length)}</b>
      <span class="sub" style="font-size:12px">${t.replayNote}</span></div>
    ${d.moments.map((m,i)=>`<div class="moment" id="m${i}">
      <div class="utt" style="font-size:14px">${esc2(m.client)}</div>
      <div class="resp" style="margin-top:8px">${t.youSaid}${esc2(m.response)}</div>
      <div class="selfjudge" id="sj${i}">
        <span class="sub" style="font-size:13px;align-self:center">${t.caught}</span>
        <button onclick="revealMoment(${i},'hit')">${t.gotIt}</button>
        <button onclick="revealMoment(${i},'miss')">${t.missedIt}</button>
      </div>
      <div class="reveal">
        <div id="cal${i}"></div>
        <div class="fbrow sub" style="font-size:13px;margin-top:6px">${t.stateWas}${esc2(m.surface)}<br>${t.stateEmo}${esc2(m.emotions)}<br>${t.stateMean}${esc2(m.meaning)}</div>
        <div style="margin-top:8px" class="fb ${m.feedback?m.feedback.verdict:''}" >
          <div class="verdict" style="font-size:14px">${m.feedback?vLabel(m.feedback.verdict):''}</div>
          <div style="font-size:13px">${esc2(m.feedback?m.feedback.comment:'')}</div>
        </div>
      </div></div>`).join('')}
    ${d.transcript&&d.transcript.length?`<details style="margin-top:16px"><summary style="cursor:pointer;font-size:14px"><b>${t.fullLog}</b>${t.fullLogN(d.transcript.length)}</summary>
      <div style="margin-top:10px">${d.transcript.map(x=>`
        <div style="margin-bottom:12px">
          <div class="utt" style="font-size:13px">${esc2(x.client)}</div>
          <div style="font-size:14px;margin-top:4px">${t.you}${esc2(x.response)} ${VB(x.verdict)}${x.polish?`<span class="sub" style="font-size:11px">${t.usedPolish}</span>`:''}</div>
        </div>`).join('')}</div></details>`:''}
    <div style="display:flex;gap:10px">
      <button style="margin-top:16px" onclick="startConv(CONV.skill,CONV.caseKey)">${t.againConv}</button>
      <button class="ghost" style="margin-top:16px" onclick="convPicker(CONV.skill)">${t.otherClient}</button>
      <button class="ghost" style="margin-top:16px" onclick="home()">${t.backList}</button>
    </div></div>`;
}
function goalProgress(ans){
  api('/api/annotate',{method:'POST',
    body:JSON.stringify({key:'goalcheck:'+CONV.sid,agree:true,note:'goal progress:'+ans,user:USER})}).catch(()=>{});
  $('#goalcheck').innerHTML=`<span class="sub" style="font-size:13px">${t.yourCall}${ans}. ${t.goalAfter}</span>`;
}
function revealMoment(i,guess){
  const m=DEBRIEF.moments[i];
  const v=m.feedback?m.feedback.verdict:null;
  const label=guess==='hit'?t.gotIt:t.missedIt;
  api('/api/annotate',{method:'POST',
    body:JSON.stringify({key:'debrief:'+CONV.sid+':'+i,agree:true,note:'self-judge:'+guess+'|verdict:'+v,user:USER})}).catch(()=>{});
  DEBRIEF_JUDGE[i]={guess,v};
  const jb=document.getElementById('judgebox'); if(jb)jb.innerHTML=judgeHtml();
  document.getElementById('m'+i).classList.add('open');
  document.getElementById('sj'+i).innerHTML='<span class="sub" style="font-size:13px">'+t.yourCall+label+'</span>';
  const consistent=(v==='hit'&&guess==='hit')||(v==='miss'&&guess==='miss');
  const el=document.getElementById('cal'+i);
  if(v==='partial'){
    el.innerHTML=`<div style="font-size:13px;color:var(--partial)">${t.calPartial}</div>`;
  }else{
    el.innerHTML=consistent
      ?`<div style="font-size:13px;color:var(--hit)">${t.calSame}</div>`
      :`<div style="font-size:13px;color:var(--miss)">${t.calDiff}</div>`;
  }
}
/* ================= SCA 标准化评估 ================= */
let SCA=null;
async function startSCA(form){
  if(!confirm(t.scaConfirm(form)))return;
  $('#app').innerHTML=`<div class="card"><div class="spin" style="display:block">${t.entering}</div></div>`;
  try{
    const r=await api('/api/sca_start',{method:'POST',
      body:JSON.stringify({form,user:USER,lang:LANG})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'start failed');
    SCA={sid:d.session_id,form,turn:0,total:d.total,msgs:[{role:'client',text:d.client_text}],bg:d.background};
    drawSCA();
  }catch(e){$('#app').innerHTML=`<div class="card"><div class="err">${e.message}</div><button onclick="home()">${t.back}</button></div>`;}
}
function drawSCA(busy){
  narrow();
  $('#app').innerHTML=`<div class="card">
    <span class="tag">${t.scaTag(SCA.form,SCA.turn,SCA.total)}</span>
    <div class="bg">${SCA.bg}</div>
    <div class="chat" id="chat">${SCA.msgs.map(m=>`<div class="msg ${m.role==='client'?'client':'me'}">${esc2(m.text)}</div>`).join('')}
      ${busy?`<div class="msg typing">${t.typing}</div>`:''}</div>
    <div class="convbar">
      <textarea id="sresp" placeholder="${t.convPh}" ${busy?'disabled':''}></textarea>
      <button id="ssend" onclick="scaSend()" ${busy?'disabled':''}>${t.send}</button>
    </div>
    <div class="sub" style="font-size:12px;margin-top:8px">${t.scaNote(SCA.total)}</div>
    <div id="serr"></div></div>`;
  const c=$('#chat');c.scrollTop=c.scrollHeight;
  const ta=$('#sresp'); if(ta&&!busy){ta.focus();ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();scaSend();}});}
}
async function scaSend(){
  const txt=$('#sresp').value.trim();
  if(!txt)return;
  SCA.msgs.push({role:'me',text:txt});SCA.turn++;drawSCA(true);
  try{
    const r=await api('/api/sca_reply',{method:'POST',
      body:JSON.stringify({session_id:SCA.sid,response:txt})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'request failed');
    if(d.ended){return scaDone();}
    SCA.msgs.push({role:'client',text:d.client_text});
    drawSCA();
  }catch(e){
    SCA.msgs.pop();SCA.turn--;drawSCA();
    $('#serr').innerHTML=`<div class="err">${e.message}${t.keptRetry}</div>`;
    $('#sresp').value=txt;
  }
}
function scaDone(){
  $('#app').innerHTML=`<div class="card"><b>${t.scaDone}</b>
    <p class="sub" style="margin-top:8px">${t.scaDoneSub(SCA.total)}</p>
    <button onclick="home()">${t.home}</button></div>`;
}
function esc2(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
document.getElementById('appTitle').textContent=t.title;
document.getElementById('appSub').textContent=t.sub;
boot();
</script>
